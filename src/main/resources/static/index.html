<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tienda API</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- CSS personalizado -->
        <link rel="stylesheet" href="/css/styles.css">
    </head>

    <body>

        <div class="container-fluid main-container">

            <!-- Sidebar -->
            <aside class="sidebar">
                <div>
                    <h2 class="logo">
                        <i class="bi bi-shop"></i>
                        TiendaApp
                    </h2>

                    <nav class="menu mt-5">
                        <a href="#" class="active">
                            <i class="bi bi-people"></i>
                            Usuarios
                        </a>

                        <a href="#">
                            <i class="bi bi-box-seam"></i>
                            Inventario
                        </a>

                        <a href="#">
                            <i class="bi bi-cart"></i>
                            Ventas
                        </a>
                    </nav>
                </div>

                <div class="sidebar-footer">
                    <p>
                        <i class="bi bi-person-circle"></i>
                        Administrador
                    </p>
                </div>

                <div class="sidebar-actions">

                    <button
                        class="btn btn-outline-danger w-100"
                        onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar Sesión

                    </button>
                </div>
                
            </aside>


            <!-- Main Content -->
            <main class="content">

                <!-- Header -->
                <div class="content-header">
                    <div>
                        <h1>Gestión de Usuarios</h1>
                        <p>Administra usuarios y roles dentro de la tienda</p>
                    </div>
                </div>

                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody id="userTableBody">

                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>


        <!-- Modal -->
        <div class="modal fade" id="userModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content custom-modal">

                    <div class="modal-header border-0">
                        <h5 class="modal-title">Registrar Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <form id="userForm">

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control custom-input" id="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control custom-input" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control custom-input" id="password" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Rol</label>
                                <select class="form-select custom-input" id="role">
                                    <option value="ADMINISTRADOR">Administrador</option>
                                    <option value="VENDEDOR">Vendedor</option>
                                    <option value="BODEGUERO">Bodeguero</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 custom-btn mt-3">
                                Guardar Usuario
                            </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>


        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

        <!-- JS -->
        <script src="js/app.js"></script>

    </body>
</html>
